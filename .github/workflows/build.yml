name: Build and Test Trading App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TRADING_DB_URL: jdbc:postgresql://localhost:5432/testdb
      TRADING_DB_USER: testuser
      TRADING_DB_PASS: testpass

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: temurin

    - name: Grant Gradle execute permission
      run: chmod +x gradlew

    - name: Build and test
      run: ./gradlew clean test

    - name: Build JAR
      run: ./gradlew bootJar

    - name: Rename JAR with SemVer + date + CI run
      run: |
        SEMVER="0.0.1"  # update this manually per official release
        DATE=$(date +%Y%m%d)
        BUILD_NO=${{ github.run_number }}
        ORIGINAL_JAR=$(ls build/libs/*.jar)
        NEW_JAR="trading-app-${SEMVER}-${DATE}-build${BUILD_NO}.jar"
        mv "$ORIGINAL_JAR" "build/libs/$NEW_JAR"
        echo "Renamed JAR: $NEW_JAR"
        
        # Save metadata for reference in Ansible or other steps
        echo "ARTIFACT_NAME=$NEW_JAR" > build/artifact-info.env
        echo "BUILD_DATE=$DATE" >> build/artifact-info.env
        echo "COMMIT_SHA=${GITHUB_SHA}" >> build/artifact-info.env

    - name: Upload artifact with metadata
      uses: actions/upload-artifact@v4
      with:
        name: trading-app-jar
        path: |
          build/libs/*.jar
          build/artifact-info.env
        retention-days: 7