name: Build and Publish Trading App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TRADING_DB_URL: jdbc:postgresql://localhost:5432/testdb
      TRADING_DB_USER: testuser
      TRADING_DB_PASS: testpass
      SEMVER: "0.0.1"  # manually bump when releasing
      BUILD_DATE: ${{ github.run_id }}
      BUILD_NO: ${{ github.run_number }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: temurin

    - name: Grant Gradle execute permission
      run: chmod +x gradlew

    - name: Build and test
      run: ./gradlew clean test

    - name: Build JAR
      run: ./gradlew bootJar

    - name: Upload artifact with metadata
      uses: actions/upload-artifact@v4
      with:
        name: trading-app-jar
        path: |
          build/libs/*.jar
        retention-days: 7

    # Only publish to GitHub Packages if push to main
    - name: Publish to GitHub Packages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: ./gradlew publish
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_PAT }}
