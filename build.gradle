plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

ext {
    appGroup = 'com.example'
    appArtifact = 'trading-app'
    appBaseVersion = '0.0.1'
    appBuildDate = new Date().format('yyyyMMdd')
}

group = appGroup
version = "${appBaseVersion}-${appBuildDate}-SNAPSHOT"
description = 'Trading App Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootRun {
    mainClass = 'com.example.trading_app.TradingAppApplication'
}

/**
 * Optional: publishing config (for GitHub Packages or Nexus)
 * Only runs when ./gradlew publish is called.
 */
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = appGroup
            artifactId = appArtifact
            version = project.version
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/YOUR_GITHUB_USER/YOUR_REPO")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
