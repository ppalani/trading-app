plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

group = 'com.example'
description = 'Demo project for Spring Boot'

// Dynamic versioning: SemVer + date + build number
def semVer = System.getenv("SEMVER") ?: "0.0.1"
def buildDate = System.getenv("BUILD_DATE") ?: new Date().format("yyyyMMdd")
def buildNo = System.getenv("BUILD_NO") ?: "local"

version = "${semVer}-${buildDate}-build${buildNo}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootRun {
    mainClass = 'com.example.trading_app.TradingAppApplication'
}

// Publishing: only the fat JAR
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact bootJar // publish the Spring Boot executable JAR
            groupId = project.group
            artifactId = 'trading-app'
            version = project.version
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ppalani/trading-app")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
