<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trade List</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h1>Trade List</h1>
<table>
    <thead>
    <tr>
        <th>Trade ID</th>
        <th>Symbol</th>
        <th>Trade Date</th>
        <th>Activity</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Amount</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="trade : ${trades}">
        <td th:text="${trade.tradeId}">Trade ID</td>
        <td th:text="${trade.symbol}">Symbol</td>
        <td th:text="${trade.tradeDate}">Trade Date</td>
        <td th:text="${trade.activity}">Activity</td>
        <td th:text="${trade.quantity}">Quantity</td>
        <td th:text="${trade.price}">Price</td>
        <td th:text="${trade.amount}">Amount</td>
    </tr>
    </tbody>
</table>
</body>
</html>
